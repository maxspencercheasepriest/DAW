name: Build

on:
  push:
  workflow_dispatch:

defaults:
  run:
    working-directory: Tracklayer

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -A x64
      - run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: Tracklayer-Windows
          path: Tracklayer/build/Tracklayer_artefacts/Release/Tracklayer.exe
