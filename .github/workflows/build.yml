name: Build

on:
  push:
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -A x64
      - run: cmake --build build --config Release --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: Tracklayer-Windows
          path: build/Tracklayer_artefacts/Release/Tracklayer.exe

  mac:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0
      - run: cmake --build build --config Release -- -quiet
      - name: Sign (ad-hoc) and zip
        run: |
          set -o pipefail
          cd build/Tracklayer_artefacts/Release
          ls -la
          step() { echo "+ $*"; if ! out=$("$@" 2>&1); then echo "$out"; echo "::error title=$1 failed::$(echo "$out" | tail -5 | tr '\n' ' ')"; exit 1; fi; echo "$out"; }
          echo "::notice title=arch::$(lipo -info Tracklayer.app/Contents/MacOS/Tracklayer 2>&1)"
          step codesign --force --deep --sign - Tracklayer.app
          step codesign --verify --verbose Tracklayer.app
          step lipo -verify_arch x86_64 arm64 Tracklayer.app/Contents/MacOS/Tracklayer
          echo "::notice title=min macOS::$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' Tracklayer.app/Contents/Info.plist 2>&1)"
          step ditto -c -k --keepParent Tracklayer.app Tracklayer-mac.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Tracklayer-Mac
          path: build/Tracklayer_artefacts/Release/Tracklayer-mac.zip
